name: Phase 4 publication acceptance

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  readiness:
    name: Require reviewed v1 evidence before public release
    if: ${{ startsWith(github.ref, 'refs/tags/') && !fromJson(inputs.plan).announcement_is_prerelease }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify complete Phase 4 acceptance
        run: >-
          python3 scripts/release/check-v1-readiness.py
          --out "$RUNNER_TEMP/phase-4-release-readiness.json"
          --require-ready

      - name: Retain readiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-4-release-readiness
          path: ${{ runner.temp }}/phase-4-release-readiness.json
          if-no-files-found: ignore
