[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
packages = ["deepkit-code"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Checksums to generate for each App
checksum = "sha256"
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".zip"
# A GitHub repo to push Homebrew formulas to
tap = "moonlysoftware/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "npm"]
# Whether to publish prereleases to package managers
publish-prereleases = false
# Ship the complete notices with each archive, including the Homebrew artifact.
include = ["LICENSE.md", "THIRD_PARTY_NOTICES.md", "licenses/third-party-licenses.tar.gz"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Whether to enable GitHub Attestations
github-attestations = true
# Native qualification runs for publishing attempts, while PRs remain plan-only.
# Keep this before host: host-jobs run alongside GitHub Release creation.
local-artifacts-jobs = ["./release-platforms"]
# musl builds include llama.cpp and therefore need Zig's musl-aware C++ toolchain.
github-build-setup = "../build-setup.yml"
# Global artifacts jobs to run in CI
global-artifacts-jobs = ["./release-sizes", "./release-acceptance"]
# Gate GitHub Release creation and downstream registry publication on reviewed
# Phase 4 evidence. The reusable job skips this check for prerelease tags.
# Post-announce jobs to run in CI
post-announce-jobs = ["./release-checksums"]

[dist.github-custom-job-permissions.release-checksums]
contents = "write"

[dist.github-custom-runners]
aarch64-apple-darwin = "macos-14"
x86_64-apple-darwin = "macos-15-intel"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
